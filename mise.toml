[env]
# Use the project name derived from the current directory
PROJECT_NAME = "{{ config_root | basename }}"
_.file = '.env'

# Automatic virtualenv activation
_.python.venv = { path = ".venv", create = true }

[tools]
python = "3.11.17"
uv = "0.13.5"

[tasks.docs-serve-locally]
description = "Serve documentation locally"
alias = "docs"
run = '''
uv sync --locked --all-extras
uv run --no-sync mkdocs serve
'''

[tasks.docs-build]
description = "Build documentation"
alias = "docs"
run = '''
uv sync --locked --all-extras
uv run --no-sync mkdocs build --strict
'''

[tasks.install]
description = "Install dependencies"
alias = "i"
run = "uv sync --locked --all-extras"

[tasks.info]
description = "Print project information"
run = '''
echo "Project: $PROJECT_NAME"
echo "Virtual Environment: $VIRTUAL_ENV"
'''

[tasks.setup]
description = "Setup the project"
run = '''
uv sync --locked --all-extras
uv run --no-sync pre-commit install
'''

[tasks.contributors-check]
description = "run all-contributors CLI"
run = 'npm exec all-contributors-cli'

[tasks.test-unittests]
description = "Run unit tests"
alias = ["ut", "tests", "test"]
run = '''
uv sync --locked --all-extras
uv run --no-sync pytest tests/
'''

[tasks.build]
depends = ["lint", "format"]
description = "Build"
run = '''
uv sync --locked --all-extras
uv run --no-sync mkdocs build --strict
uv build
'''

[tasks.format]
description = "Format the code"
run = "uv run --locked --all-extras ruff format --check --diff"

[tasks.lint]
description = "Lint the code"
run = "uv run --locked --all-extras ruff check ."

[tasks.test-publish-release]
description = "Test the release process. Build first, then publish to test.pypi.org"
depends = ["build"]
run = '''
uv publish \
  --username $UV_PUBLISH_USERNAME \
  --password $UV_PUBLISH_PASSWORD_TEST \
  --publish-url https://test.pypi.org/legacy/
'''

[tasks.publish-release]
description = "Release builds to PyPI"
depends = ["build"]
run = '''
uv publish \
  --username $UV_PUBLISH_USERNAME \
  --password $UV_PUBLISH_PASSWORD_PROD \
  --publish-url https://upload.pypi.org/legacy/
'''
