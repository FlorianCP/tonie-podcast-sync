repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: uv-lock
        name: Check uv.lock
        entry: mise exec -- uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff format
        name: ruff format
        entry: mise run format
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff check
        name: ruff check
        entry: mise run lint
        language: system
        types: [python]
        pass_filenames: false
