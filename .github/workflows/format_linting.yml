name: Format and Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install project tools
        uses: jdx/mise-action@v3
        with:
          install_args: python uv
      - name: Lint with ruff
        run: |
          mise run lint
      - name: Format with ruff
        run: |
          mise run format
